<style>
:root{
  --bg:#F8F7FD; --bg-soft:#F1EFF9; --bg-deep:#E9E6F4;
  --ink:#14161F; --muted:#4A4F63; --line:#D9D6EA;
  --blue:#2B4F9E; --blue-dark:#1E3A78; --navy:#1E3258;
  --stone:#8A7F6B; --teal:#3F8A8C; --teal-soft:#E2F0EF; --sky-soft:#E7EFF9; --sage:#6E9E7E; --sage-soft:#E8F2EA; --gold:#C2A15B; --peach-soft:#FBEEE4; --cream:#FBF7F1; --wa:#2F6F57; --ph-bg:rgba(138,127,107,.14);
  --serif:'Lora',Georgia,'Times New Roman',serif;
  --body:'Nunito Sans','Segoe UI',system-ui,-apple-system,sans-serif;
  --radius:14px; --header-h:76px;
}
*,*::before,*::after{box-sizing:border-box}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.7;overflow-x:hidden}
img,svg{max-width:100%;display:block}
a{color:inherit}
h1,h2,h3,h4{font-family:var(--serif);font-weight:500;line-height:1.2;margin:0 0 .5em;color:var(--ink)}
p{margin:0 0 1em}
.container{width:100%;max-width:1160px;margin:0 auto;padding:0 24px}
section{position:relative;padding:104px 0;scroll-margin-top:var(--header-h)}
.skip{position:absolute;left:-999px;top:8px;background:var(--blue-dark);color:#fff;padding:10px 16px;border-radius:8px;z-index:100}
.skip:focus{left:8px}
:focus-visible{outline:2px solid var(--blue);outline-offset:3px;border-radius:4px}

/* placeholders */
body:not(.no-ph) .ph{background:var(--ph-bg);border-bottom:1px dashed var(--stone);padding:0 .2em;border-radius:3px}

/* scroll progress */
.progress{position:fixed;top:0;left:0;height:3px;width:100%;background:var(--blue);transform:scaleX(0);transform-origin:left;z-index:60}

/* header */
header.site{position:sticky;top:0;z-index:50;background:rgba(248,247,253,.9);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid transparent;transition:box-shadow .3s,border-color .3s}
header.site.scrolled{box-shadow:0 2px 18px rgba(30,50,88,.08);border-color:var(--line)}
.nav{display:flex;align-items:center;justify-content:space-between;height:var(--header-h);gap:24px}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;font-family:var(--serif);font-size:1.7rem;color:var(--blue);font-weight:500}
.brand svg,.brand img{width:34px;height:34px;flex:none}
.menu{display:flex;align-items:center;gap:30px}
.menu a{text-decoration:none;font-size:1rem;position:relative;padding:4px 0}
.menu a.btn{padding:9px 22px}
.menu a:not(.btn)::after{content:"";position:absolute;left:0;bottom:-2px;height:1px;width:100%;background:var(--blue);transform:scaleX(0);transform-origin:left;transition:transform .3s}
.menu a:not(.btn):hover::after{transform:scaleX(1)}
.menu-btn{display:none;background:none;border:1px solid var(--line);border-radius:8px;width:44px;height:44px;cursor:pointer;color:var(--ink)}
.menu-btn span,.menu-btn span::before,.menu-btn span::after{display:block;width:20px;height:2px;background:currentColor;margin:0 auto;position:relative;transition:transform .3s,background .3s}
.menu-btn span::before,.menu-btn span::after{content:"";position:absolute;left:0}
.menu-btn span::before{top:-6px}.menu-btn span::after{top:6px}

/* buttons */
.btn{display:inline-flex;align-items:center;gap:10px;font-family:var(--body);font-size:1rem;padding:13px 28px;border-radius:999px;border:1px solid var(--ink);background:transparent;color:var(--ink);text-decoration:none;cursor:pointer;transition:background .3s,color .3s,transform .3s,box-shadow .3s}
.btn svg{width:18px;height:18px;flex:none}
.btn:hover{transform:translateY(-2px);box-shadow:0 8px 20px rgba(30,50,88,.12)}
.btn-primary{background:var(--blue-dark);border-color:var(--blue-dark);color:#fff}
.btn-primary:hover{background:var(--blue)}
.btn-outline:hover{background:var(--ink);color:#fff}
.btn-small{padding:9px 20px;font-size:.95rem}
.btn-light{background:#fff;border-color:#fff;color:var(--navy)}
.btn-light:hover{background:var(--bg-soft)}

/* hero */
.hero{padding:0;min-height:calc(100vh - var(--header-h));min-height:calc(100svh - var(--header-h));display:flex;align-items:center;text-align:center;background:radial-gradient(ellipse at 12% 18%,rgba(110,175,172,.24),transparent 55%),radial-gradient(ellipse at 88% 85%,rgba(232,175,150,.22),transparent 55%),linear-gradient(135deg,#E6EFFA 0%,#F2EFF9 55%,#E9F4F1 100%);overflow:hidden}
.hero .container{position:relative;z-index:2;padding-top:72px;padding-bottom:72px}
.hero h1{font-size:clamp(2.6rem,6.4vw,5.2rem);font-weight:500;letter-spacing:-.01em;margin-bottom:.45em}
.hero h1 .l{display:block}
.hero h1 em{font-style:normal;color:var(--blue)}
.hero p.intro{max-width:640px;margin:0 auto 34px;color:var(--muted);font-size:1.1rem}
.hero .actions{display:flex;flex-wrap:wrap;gap:14px;justify-content:center}
.trust{margin-top:44px;display:inline-flex;align-items:center;gap:10px;font-size:.98rem;color:var(--muted);text-decoration:none;border-top:1px solid var(--line);padding-top:18px}
.stars{display:inline-flex;gap:2px;color:#B58A2E}
.stars svg{width:16px;height:16px;fill:currentColor}
.stars .off{color:var(--line)}
.contour{position:absolute;inset:0;width:100%;height:100%;color:var(--blue);opacity:.16;z-index:0;pointer-events:none}
.contour g{animation:drift 28s ease-in-out infinite alternate}
@keyframes drift{from{transform:translate(-30px,6px)}to{transform:translate(30px,-8px)}}
.hero .h-in{opacity:0;transform:translateY(20px);animation:rise .9s cubic-bezier(.2,.7,.2,1) forwards;animation-delay:calc(var(--d,0)*140ms + 150ms)}
@keyframes rise{to{opacity:1;transform:none}}

/* section headings */
.eyebrow{display:block;font-size:.8rem;font-weight:700;letter-spacing:.18em;text-transform:uppercase;color:var(--teal);margin-bottom:14px}
.sec-head{max-width:680px;margin-bottom:56px}
.sec-head.center{margin-left:auto;margin-right:auto;text-align:center}
.sec-head h2{font-size:clamp(2rem,4vw,3rem)}
.sec-head h2::after{content:"";display:block;width:46px;height:3px;border-radius:3px;background:linear-gradient(90deg,var(--teal),var(--blue));margin-top:16px}
.sec-head.center h2::after{margin-left:auto;margin-right:auto}
.sec-head p{color:var(--muted)}

/* about */
.about-grid{display:grid;grid-template-columns:1fr 1.1fr;gap:64px;align-items:start;margin-bottom:72px}
.about-grid h2{font-size:clamp(2rem,4vw,3rem);margin:0}
.about-grid p{color:var(--muted)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:20px}
.stat{padding:28px 24px 26px;border-radius:var(--radius);border:1px solid rgba(30,50,88,.06)}
.stat:nth-child(1){background:var(--sky-soft)}.stat:nth-child(2){background:var(--teal-soft)}.stat:nth-child(3){background:var(--sage-soft)}.stat:nth-child(4){background:var(--peach-soft)}
.stat .num{font-family:var(--serif);font-weight:600;font-size:clamp(1.9rem,3.2vw,2.6rem);line-height:1.15;margin-bottom:6px;color:var(--blue-dark)}
.stat .lbl{font-family:var(--serif);font-size:1.15rem;margin-bottom:14px}
.stat .rule{height:1px;background:var(--ink);opacity:.22;margin-bottom:14px;transform-origin:left}
.js .stat .rule{transform:scaleX(0);transition:transform 1.1s cubic-bezier(.2,.7,.2,1) .2s}
.js .stat.in .rule{transform:scaleX(1)}
.stat p{font-size:.95rem;color:var(--muted);margin:0}

/* services */
.services{background:linear-gradient(180deg,#E9F1FA 0%,#EDF5F4 100%)}
.svc-grid{display:grid;grid-template-columns:1fr 1fr;gap:24px}
.svc{--c:var(--blue);display:grid;grid-template-columns:48px 1fr;gap:6px 18px;padding:26px 26px 24px;background:#fff;border:1px solid var(--line);border-top:3px solid var(--c);border-radius:var(--radius);transition:transform .35s,box-shadow .35s}
.svc:nth-child(4n+2){--c:var(--teal)}.svc:nth-child(4n+3){--c:var(--gold)}.svc:nth-child(4n+4){--c:var(--sage)}
.svc:hover{transform:translateY(-5px);box-shadow:0 16px 32px rgba(30,50,88,.10)}
.svc .n{display:flex;align-items:center;justify-content:center;width:42px;height:42px;border-radius:50%;background:color-mix(in srgb,var(--c) 14%,#fff);color:var(--c);font-family:var(--serif);font-weight:600;font-size:1rem}
.svc h3{font-size:1.3rem;margin-bottom:.25em}
.svc p{margin:0;color:var(--muted);font-size:.98rem}

/* team */
.team{background:linear-gradient(180deg,#F6F9FC 0%,#F3F8F8 100%)}
.lead{display:grid;grid-template-columns:380px 1fr;gap:64px;align-items:center;background:linear-gradient(135deg,#fff 0%,#F1F7F9 100%);border:1px solid var(--line);border-left:4px solid var(--teal);border-radius:var(--radius);padding:40px;margin-bottom:72px;transition:box-shadow .4s}
.lead:hover{box-shadow:0 18px 44px rgba(30,50,88,.09)}
.photo{position:relative;background:linear-gradient(160deg,#E9E6F4,#F4EEF5);overflow:hidden}
.photo img{width:100%;height:100%;object-fit:cover}
.photo .sil{width:100%;height:100%;color:#B9B4D3}
.lead .photo{aspect-ratio:4/5;border-radius:10px}
.lead h3{font-size:clamp(1.8rem,3vw,2.4rem);margin-bottom:.15em}
.lead .role{color:var(--teal);font-weight:600;font-size:1.05rem;margin-bottom:6px}
.lead .quals{font-weight:500;margin-bottom:18px}
.lead .bio{color:var(--muted)}
.chips{list-style:none;margin:22px 0 0;padding:0;display:flex;flex-wrap:wrap;gap:10px}
.chips li{border:1px solid #CDE4E2;border-radius:999px;padding:6px 16px;font-size:.92rem;background:var(--teal-soft)}
.sub-title{font-size:1.6rem;margin-bottom:28px;text-align:center}
.spec-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:24px}
.spec{--c:var(--blue);background:#fff;border:1px solid var(--line);border-top:3px solid var(--c);border-radius:var(--radius);padding:30px 22px;text-align:center;transition:transform .35s,box-shadow .35s}
.spec:nth-child(4n+2){--c:var(--teal)}.spec:nth-child(4n+3){--c:var(--gold)}.spec:nth-child(4n+4){--c:var(--sage)}
.spec:hover{transform:translateY(-6px);box-shadow:0 16px 34px rgba(30,50,88,.09)}
.spec .photo{width:132px;height:132px;border-radius:50%;margin:0 auto 18px;box-shadow:0 0 0 4px #fff,0 0 0 5px var(--c)}
.spec h4{font-size:1.2rem;margin-bottom:.15em}
.spec .sp{color:var(--teal);font-weight:600;font-size:.98rem;margin-bottom:4px}
.spec .q,.spec .tx{font-size:.92rem;color:var(--muted);margin:0}
.staff-wrap{margin-top:72px}

/* why */
.why{background:linear-gradient(180deg,#E8F3F1 0%,#EEF5EE 100%)}
.why-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:24px}
.why-item{--c:var(--teal)}
.why-item:nth-child(3n+1){--c:var(--blue)}.why-item:nth-child(3n+3){--c:var(--sage)}
.why-item .n{display:flex;align-items:center;justify-content:center;width:40px;height:40px;border-radius:50%;background:color-mix(in srgb,var(--c) 14%,#fff);color:var(--c);font-family:var(--serif);font-weight:600;font-size:1rem;margin-bottom:16px}
.why-item h3{font-size:1.3rem}
.why-item p{color:var(--muted);font-size:.98rem;margin:0}
.why-item{background:#fff;border:1px solid var(--line);border-radius:var(--radius);padding:28px 26px;transition:transform .35s,box-shadow .35s}
.why-item:hover{transform:translateY(-5px);box-shadow:0 14px 30px rgba(30,50,88,.09)}

/* reviews */
.reviews{background:var(--cream)}
.rev-top{display:flex;justify-content:space-between;align-items:flex-end;gap:32px;flex-wrap:wrap;margin-bottom:48px}
.rev-top .sec-head{margin:0}
.score{display:flex;align-items:center;gap:14px}
.score .big{font-family:var(--serif);font-size:3rem;line-height:1}
.score small{display:block;color:var(--muted);font-size:.92rem}
.rev-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:24px;margin-bottom:44px}
.rev{margin:0;background:#fff;border:1px solid #EADFCB;border-top:3px solid var(--gold);border-radius:var(--radius);padding:30px 28px;display:flex;flex-direction:column;transition:transform .35s,box-shadow .35s}
.rev:hover{transform:translateY(-6px);box-shadow:0 16px 34px rgba(30,50,88,.09)}
.rev blockquote{margin:16px 0 22px;color:var(--muted);flex:1;font-size:.98rem}
.rev .who{border-top:1px solid var(--line);padding-top:16px;font-size:.95rem}
.rev .who b{display:block;font-weight:500;font-size:1rem}
.rev .who span{color:var(--muted)}
.center-btn{text-align:center}

/* gallery */
.gallery{background:linear-gradient(180deg,#EAF1FA 0%,#F1EFF9 100%)}
.gal-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:24px}
.tile{position:relative;aspect-ratio:4/3;border-radius:var(--radius);overflow:hidden;border:1px solid var(--line);background:linear-gradient(160deg,#E9E6F4,#F4EEF5);padding:0;cursor:default;display:flex;align-items:center;justify-content:center;font:inherit;color:var(--muted)}
.tile img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transition:transform .8s cubic-bezier(.2,.7,.2,1)}
.tile.has-img{cursor:zoom-in}
.tile.has-img:hover img{transform:scale(1.05)}
.tile .cap{position:relative;padding:0 16px;text-align:center;font-size:.95rem}
dialog#lb{border:0;padding:0;background:transparent;max-width:92vw;max-height:92vh}
dialog#lb::backdrop{background:rgba(20,22,31,.82)}
dialog#lb img{max-width:92vw;max-height:88vh;border-radius:10px}
dialog#lb button{position:absolute;top:-6px;right:-6px;width:40px;height:40px;border-radius:50%;border:0;background:#fff;font-size:1.4rem;cursor:pointer;line-height:1}

/* community */
.community{padding:0;background:linear-gradient(135deg,#1E3258 0%,#245068 100%);color:#fff;overflow:hidden}
.community .container{position:relative;z-index:2;padding-top:88px;padding-bottom:88px;text-align:center}
.community h2{color:#fff;font-size:clamp(1.9rem,4vw,2.8rem)}
.community p{color:#D5DAEA;max-width:560px;margin:0 auto 30px}
.community .contour{color:#fff;opacity:.08}

/* contact */
.contact-grid{display:grid;grid-template-columns:1.1fr 1fr 1fr;gap:48px;margin-bottom:48px}
.contact-grid h2{font-size:clamp(2rem,4vw,3rem)}
.contact-grid>div:nth-child(2),.contact-grid>div:nth-child(3){background:#fff;border:1px solid var(--line);border-radius:var(--radius);padding:28px 28px 22px;border-top:3px solid var(--teal)}
.contact-grid>div:nth-child(3){border-top-color:var(--gold)}
.contact-grid h3{font-size:1.5rem;margin-bottom:.6em}
.contact-grid p{color:var(--muted);margin-bottom:.4em}
.hrs div{margin-bottom:12px}
.hrs b{font-weight:500;display:block}
.hrs span{display:block;color:var(--muted)}
.contact-actions{display:flex;flex-wrap:wrap;gap:12px;margin-top:22px}
.map{border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;height:400px;background:var(--bg-soft)}
.map iframe{width:100%;height:100%;border:0;display:block}

/* footer */
footer.site{position:relative;background:linear-gradient(180deg,#E4ECF8 0%,#DFEDEF 100%);overflow:hidden;padding:72px 0 28px}
footer.site .contour{opacity:.12}
footer.site .container{position:relative;z-index:2}
.foot-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:36px;border-top:1px solid var(--ink);padding-top:44px;margin-bottom:48px}
.foot-grid h4{font-family:var(--serif);font-size:1rem;letter-spacing:.08em;text-transform:uppercase;margin-bottom:16px}
.foot-grid p,.foot-grid a,.foot-grid li{font-size:.95rem;color:var(--muted)}
.foot-grid ul{list-style:none;margin:0;padding:0}
.foot-grid li{margin-bottom:8px}
.foot-grid a{text-decoration:none}
.foot-grid a:hover{color:var(--blue);text-decoration:underline}
.foot-grid .ig{display:inline-flex;align-items:center;gap:8px}
.foot-grid .ig svg{width:18px;height:18px}
.foot-bot{display:flex;justify-content:space-between;flex-wrap:wrap;gap:12px;font-size:.92rem;color:var(--muted)}

/* floating whatsapp */
.fab{position:fixed;right:20px;bottom:20px;width:56px;height:56px;border-radius:50%;background:var(--wa);color:#fff;display:flex;align-items:center;justify-content:center;box-shadow:0 8px 22px rgba(20,22,31,.25);z-index:40;transition:transform .3s,box-shadow .3s}
.fab:hover{transform:translateY(-3px) scale(1.04)}
.fab svg{width:28px;height:28px;fill:currentColor}

/* scroll reveal */
.js .reveal{opacity:0;transform:translateY(28px);transition:opacity .85s ease,transform .85s cubic-bezier(.2,.7,.2,1);transition-delay:calc(var(--i,0)*90ms)}
.js .reveal.in{opacity:1;transform:none}
.js .reveal.fade{transform:none}
.js .reveal.done{transition:transform .35s ease,box-shadow .35s ease,border-color .35s ease;transition-delay:0s}

@media (max-width:1000px){
  .about-grid{grid-template-columns:1fr;gap:20px}
  .stats{grid-template-columns:repeat(3,1fr)}
  .lead{grid-template-columns:260px 1fr;gap:36px;padding:28px}
  .spec-grid{grid-template-columns:repeat(2,1fr)}
  .why-grid,.rev-grid,.gal-grid{grid-template-columns:repeat(2,1fr)}
  .contact-grid{grid-template-columns:1fr 1fr}
  .contact-grid>:first-child{grid-column:1/-1}
  .foot-grid{grid-template-columns:repeat(2,1fr)}
}
@media (max-width:820px){
  .menu-btn{display:block}
  .menu{position:absolute;top:var(--header-h);left:0;right:0;background:var(--bg);border-bottom:1px solid var(--line);flex-direction:column;align-items:flex-start;gap:0;padding:8px 24px 22px;display:none;box-shadow:0 14px 24px rgba(30,50,88,.08)}
  .menu.open{display:flex}
  .menu a{padding:14px 0;width:100%;border-bottom:1px solid var(--line)}
  .menu a.btn{margin-top:16px;width:auto;border:1px solid var(--blue-dark);justify-content:center}
  .menu a:not(.btn)::after{display:none}
}
@media (max-width:700px){
  body{font-size:16px}
  section{padding:68px 0}
  .container{padding:0 20px}
  .svc-grid{grid-template-columns:1fr}
  .lead{grid-template-columns:1fr;text-align:center}
  .lead .photo{max-width:260px;margin:0 auto}
  .chips{justify-content:center}
  .spec-grid,.why-grid,.rev-grid,.gal-grid,.contact-grid,.foot-grid{grid-template-columns:1fr}
  .stats{grid-template-columns:1fr;gap:16px}
  .hero .actions .btn{width:100%;justify-content:center}
  .map{height:320px}
  .brand{font-size:1.45rem}
}
@media (prefers-reduced-motion:reduce){
  html{scroll-behavior:auto}
  *,*::before,*::after{animation:none!important;transition:none!important}
  .js .reveal,.hero .h-in{opacity:1!important;transform:none!important}
  .js .stat .rule{transform:none!important}
}

<body>
<noscript>
  <p style="padding:24px;font-family:Georgia,serif">Suraksha Dental Clinic, # G-1, 2, Krishna Complex, Shivanandanagar, Nagarbhavi Road, Moodalapalya, Bengaluru 560 072. Phone: +91 97411 04144. Please enable JavaScript to view this page.</p>
</noscript>
<a class="skip" href="#main">Skip to content</a>
<div class="progress" id="progress"></div>
<div id="app"></div>
<dialog id="lb" aria-label="Clinic photo"><img alt=""><button type="button" aria-label="Close">&times;</button></dialog>

<script>
(function(){
  const C = SITE_CONFIG;
  if(!C.showPlaceholderHighlight) document.body.classList.add('no-ph');

  /* ---------- helpers ---------- */
  const esc = s => String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const isPH = v => typeof v==='string' && /^\s*\[.*\]\s*$/.test(v);
  const T = v => isPH(v) ? `<span class="ph">${esc(v)}</span>` : esc(v);
  const ext = u => u ? `href="${esc(u)}" target="_blank" rel="noopener"` : `href="#" data-unset="1" title="Link not set yet. See EDITING-GUIDE.md"`;
  const pad = n => String(n+1).padStart(2,'0');

  const I = {
    phone:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"/></svg>',
    wa:'<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413z"/></svg>',
    ig:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.3" cy="6.7" r="1" fill="currentColor" stroke="none"/></svg>',
    pin:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/></svg>',
    star:'<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2.5l2.9 6.1 6.6.8-4.9 4.6 1.3 6.6L12 17.3 6.1 20.6l1.3-6.6L2.5 9.4l6.6-.8z"/></svg>',
    sil:'<svg class="sil" viewBox="0 0 100 100" fill="currentColor" aria-hidden="true" preserveAspectRatio="xMidYMax slice"><circle cx="50" cy="38" r="16"/><path d="M14 100c0-22 16-36 36-36s36 14 36 36z"/></svg>'
  };

  const logoSvg = `<svg viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M16 8.2c-2.6-3-8.3-2.1-9.4 2.4-.9 3.7.9 6.8 2.2 10.4.9 2.6 1.1 6.7 3.1 6.7 1.8 0 1.6-3.8 2.6-5.4.5-.8 1.5-1.1 1.5-1.1s1 .3 1.5 1.1c1 1.6.8 5.4 2.6 5.4 2 0 2.2-4.1 3.1-6.7 1.3-3.6 3.1-6.7 2.2-10.4C24.3 6.100 18.600 5.200 16 8.200z" transform="translate(0 -1)"/><path d="M26.500 2.500v4M24.500 4.500h4" stroke-width="1.2"/></svg>`;

  const contour = () => {
    let p='';
    [0,16,32,48,64].forEach(o=>{ p+=`<path d="M-100 ${520+o} C 200 ${300+o}, 520 ${620+o}, 860 ${420+o} S 1380 ${180+o}, 1700 ${360+o}"/>`; });
    [0,16,32,48].forEach(o=>{ p+=`<path d="M-100 ${120+o} C 240 ${20+o}, 560 ${260+o}, 900 ${150+o} S 1400 ${40+o}, 1700 ${120+o}"/>`; });
    return `<svg class="contour" viewBox="0 0 1600 800" preserveAspectRatio="xMidYMid slice" aria-hidden="true"><g fill="none" stroke="currentColor" stroke-width="1">${p}</g></svg>`;
  };

  const stars = n => { let s=''; for(let i=0;i<5;i++) s+=`<span class="${i<n?'':'off'}">${I.star}</span>`; return `<span class="stars" role="img" aria-label="${n} out of 5 stars">${s}</span>`; };
  const photo = (src,alt) => `<div class="photo">${src?`<img src="${esc(src)}" alt="${esc(alt)}" loading="lazy">`:I.sil}</div>`;
  const reveal = (i=0,extra='') => `class="reveal ${extra}" style="--i:${i}"`;

  const addr = C.clinic.addressLines.map(esc).join('<br>');
  const mapSrc = 'https://www.google.com/maps?q='+encodeURIComponent(C.clinic.mapQuery)+'&output=embed';
  const dirHref = 'https://www.google.com/maps/search/?api=1&query='+encodeURIComponent(C.clinic.mapQuery);
  const tel = 'tel:'+C.clinic.phoneTel;
  const hoursHtml = C.hours.display.map(h=>`<div><b>${esc(h.days)}</b>${h.times.map(t=>`<span>${esc(t)}</span>`).join('')}</div>`).join('');
  const hoursFoot = C.hours.display.map(h=>`<p style="margin-bottom:10px"><b style="font-weight:500">${esc(h.days)}</b><br>${h.times.map(esc).join('<br>')}</p>`).join('');

  const brandInner = (C.clinic.logo ? `<img src="${esc(C.clinic.logo)}" alt="">` : logoSvg) + `<span>${esc(C.clinic.shortName)}</span>`;

  /* ---------- header ---------- */
  const header = `
  <header class="site" id="header">
    <div class="container nav">
      <a class="brand" href="#top" aria-label="${esc(C.clinic.name)} home">${brandInner}</a>
      <button class="menu-btn" id="menuBtn" aria-label="Open menu" aria-expanded="false" aria-controls="menu"><span></span></button>
      <nav class="menu" id="menu" aria-label="Main">
        <a href="#about">About Us</a>
        <a href="#services">Services</a>
        <a href="#team">Our Team</a>
        <a href="#reviews">Reviews</a>
        <a href="#contact">Contact Us</a>
        <a class="btn btn-primary btn-small" href="${tel}">${I.phone}Call now</a>
      </nav>
    </div>
  </header>`;

  /* ---------- hero ---------- */
  const line = a => `${esc(a[0])}<em>${esc(a[1])}</em>${esc(a[2])}`;
  const hero = `
  <section class="hero" id="top">
    ${contour()}
    <div class="container">
      <h1>
        <span class="l h-in" style="--d:0">${line(C.hero.headlineLine1)}</span>
        <span class="l h-in" style="--d:1">${line(C.hero.headlineLine2)}</span>
      </h1>
      <p class="intro h-in" style="--d:2">${esc(C.hero.intro)}</p>
      <div class="actions h-in" style="--d:3">
        <a class="btn btn-primary" href="${tel}">${I.phone}Call now</a>
        <a class="btn btn-outline" ${ext(C.links.whatsappCommunity)}>${I.wa}Join our WhatsApp community</a>
      </div>
      <a class="trust h-in" style="--d:4" href="#reviews">${stars(5)}<span>${T(C.reviews.rating)} on Google &middot; ${T(C.reviews.count)} reviews</span></a>
    </div>
  </section>`;

  /* ---------- about + stats ---------- */
  const about = `
  <section id="about">
    <div class="container">
      <div class="about-grid">
        <h2 ${reveal(0)}>${esc(C.about.title)}</h2>
        <div ${reveal(1)}>${C.about.paragraphs.map(p=>`<p>${esc(p)}</p>`).join('')}</div>
      </div>
      <div class="stats">
        ${C.stats.map((s,i)=>`
        <div class="stat reveal" style="--i:${i}">
          <div class="num" data-count="${esc(s.value)}">${esc(s.value)}</div>
          <div class="lbl">${esc(s.label)}</div>
          <div class="rule"></div>
          <p>${esc(s.text)}</p>
        </div>`).join('')}
      </div>
    </div>
  </section>`;

  /* ---------- services ---------- */
  const services = `
  <section class="services" id="services">
    <div class="container">
      <div class="sec-head reveal"><span class="eyebrow">Specialties</span><h2>${esc(C.services.title)}</h2><p>${esc(C.services.intro)}</p></div>
      <div class="svc-grid">
        ${C.services.items.map((s,i)=>`
        <div class="svc reveal" style="--i:${i%2}">
          <span class="n">${pad(i)}</span>
          <div><h3>${esc(s.name)}</h3><p>${esc(s.text)}</p></div>
        </div>`).join('')}
      </div>
    </div>
  </section>`;

  /* ---------- team ---------- */
  const D = C.doctors, L = D.lead;
  const staff = D.staff && D.staff.length ? `
      <div class="staff-wrap">
        <h3 class="sub-title reveal">${esc(D.staffTitle)}</h3>
        <div class="spec-grid">
          ${D.staff.map((s,i)=>`
          <div class="spec reveal" style="--i:${i}">${photo(s.photo,s.name)}<h4>${T(s.name)}</h4><p class="sp">${T(s.role)}</p><p class="tx">${T(s.text||'')}</p></div>`).join('')}
        </div>
      </div>` : '';
  const team = `
  <section id="team" class="team">
    <div class="container">
      <div class="sec-head center reveal"><span class="eyebrow">Our Team</span><h2>${esc(D.title)}</h2><p>${esc(D.intro)}</p></div>
      <article class="lead reveal">
        ${photo(L.photo,L.name)}
        <div>
          <h3>${T(L.name)}</h3>
          <p class="role">${T(L.role)}</p>
          <p class="quals">${T(L.qualifications)} &middot; ${T(L.experience)}</p>
          <p class="bio">${T(L.bio)}</p>
          <ul class="chips">${L.highlights.map(h=>`<li>${T(h)}</li>`).join('')}</ul>
        </div>
      </article>
      <h3 class="sub-title reveal">${esc(D.specialistsTitle)}</h3>
      <div class="spec-grid">
        ${D.specialists.map((s,i)=>`
        <div class="spec reveal" style="--i:${i}">${photo(s.photo,s.name)}<h4>${T(s.name)}</h4><p class="sp">${T(s.specialty)}</p><p class="q">${T(s.qualifications)}</p></div>`).join('')}
      </div>
      ${staff}
    </div>
  </section>`;

  /* ---------- why ---------- */
  const why = `
  <section class="why" id="why">
    <div class="container">
      <div class="sec-head center reveal"><span class="eyebrow">Why Suraksha</span><h2>${esc(C.why.title)}</h2></div>
      <div class="why-grid">
        ${C.why.items.map((w,i)=>`
        <div class="why-item reveal" style="--i:${i%3}"><span class="n">${pad(i)}</span><h3>${T(w.title)}</h3><p>${T(w.text)}</p></div>`).join('')}
      </div>
    </div>
  </section>`;

  /* ---------- reviews ---------- */
  const reviews = `
  <section id="reviews" class="reviews">
    <div class="container">
      <div class="rev-top">
        <div class="sec-head reveal"><span class="eyebrow">Patient Reviews</span><h2>${esc(C.reviews.title)}</h2></div>
        <div class="score reveal" style="--i:1"><span class="big">${T(C.reviews.rating)}</span><div>${stars(5)}<small>${T(C.reviews.count)} Google reviews</small></div></div>
      </div>
      <div class="rev-grid">
        ${C.reviews.items.map((r,i)=>`
        <figure class="rev reveal" style="--i:${i}" ${''}>
          ${stars(r.rating||5)}
          <blockquote>&ldquo;${T(r.text)}&rdquo;</blockquote>
          <figcaption class="who"><b>${T(r.name)}</b><span>${T(r.treatment)}</span></figcaption>
        </figure>`).join('')}
      </div>
      <div class="center-btn reveal"><a class="btn btn-outline" ${ext(C.links.googleReviews)}>${esc(C.reviews.buttonLabel)}</a></div>
    </div>
  </section>`;

  /* ---------- gallery ---------- */
  const gallery = `
  <section class="gallery" id="clinic">
    <div class="container">
      <div class="sec-head center reveal"><span class="eyebrow">The Clinic</span><h2>${esc(C.gallery.title)}</h2><p>${esc(C.gallery.intro)}</p></div>
      <div class="gal-grid">
        ${C.gallery.items.map((g,i)=> g.src
          ? `<button type="button" class="tile has-img reveal" style="--i:${i}" data-src="${esc(g.src)}" data-alt="${esc(g.alt)}" aria-label="Enlarge photo: ${esc(g.alt)}"><img src="${esc(g.src)}" alt="${esc(g.alt)}" loading="lazy"></button>`
          : `<div class="tile reveal" style="--i:${i}" role="img" aria-label="${esc(g.alt)} (photo to be added)"><span class="cap">${T(g.caption)}</span></div>`).join('')}
      </div>
    </div>
  </section>`;

  /* ---------- community ---------- */
  const community = `
  <section class="community" id="community">
    ${contour()}
    <div class="container">
      <div class="reveal">
        <h2>${esc(C.community.title)}</h2>
        <p>${esc(C.community.text)}</p>
        <a class="btn btn-light" ${ext(C.links.whatsappCommunity)}>${I.wa}${esc(C.community.buttonLabel)}</a>
      </div>
    </div>
  </section>`;

  /* ---------- contact ---------- */
  const contact = `
  <section id="contact">
    <div class="container">
      <div class="contact-grid">
        <div class="reveal"><h2>${esc(C.contact.title)}</h2><p>${esc(C.contact.intro)}</p>
          <div class="contact-actions">
            <a class="btn btn-primary" href="${tel}">${I.phone}${esc(C.clinic.phoneDisplay)}</a>
            <a class="btn btn-outline" href="${dirHref}" target="_blank" rel="noopener">${I.pin}Get directions</a>
          </div>
        </div>
        <div class="reveal" style="--i:1"><h3>Location</h3><p>${addr}</p></div>
        <div class="reveal hrs" style="--i:2"><h3>Hours</h3>${hoursHtml}</div>
      </div>
      <div class="map reveal fade"><iframe title="Map showing ${esc(C.clinic.name)}" src="${mapSrc}" loading="lazy" referrerpolicy="no-referrer-when-downgrade" allowfullscreen></iframe></div>
    </div>
  </section>`;

  /* ---------- footer ---------- */
  const footer = `
  <footer class="site">
    ${contour()}
    <div class="container">
      <div class="foot-grid">
        <div><h4>Get in touch</h4><p><a href="${tel}">Ph. ${esc(C.clinic.phoneDisplay)}</a></p><p>${addr}</p></div>
        <div><h4>Menu</h4><ul>
          <li><a href="#about">About</a></li><li><a href="#team">Our Team</a></li>
          <li><a href="#services">Services</a></li><li><a href="#reviews">Reviews</a></li><li><a href="#contact">Contact Us</a></li></ul></div>
        <div><h4>Follow us</h4><ul>
          <li><a class="ig" ${ext(C.links.instagram)}>${I.ig}Instagram</a></li>
          <li><a ${ext(C.links.whatsappCommunity)}>WhatsApp community</a></li></ul></div>
        <div><h4>Opening hours</h4>${hoursFoot}</div>
      </div>
      <div class="foot-bot"><span>&copy; ${new Date().getFullYear()} ${esc(C.clinic.name)}.</span><span>${esc(C.clinic.addressCity)}</span></div>
    </div>
  </footer>
  <a class="fab" ${ext(C.links.whatsappCommunity)} aria-label="Join our WhatsApp community">${I.wa}</a>`;

  document.getElementById('app').innerHTML = header + `<main id="main">` + hero + about + services + team + why + reviews + gallery + community + contact + `</main>` + footer;

  /* ---------- structured data for search engines ---------- */
  try{
    const rn = parseFloat(C.reviews.rating), rc = parseInt(C.reviews.count,10);
    const ld = {
      "@context":"https://schema.org","@type":"Dentist",
      "name":C.clinic.name,"telephone":C.clinic.phoneTel,"url":location.href.split('#')[0],
      "address":{"@type":"PostalAddress","streetAddress":C.clinic.addressLines.join(' ').replace(/\s+/g,' ').trim(),"addressLocality":C.clinic.addressCity,"postalCode":C.clinic.addressPostcode,"addressCountry":"IN"},
      "openingHoursSpecification":C.hours.schema.map(h=>({"@type":"OpeningHoursSpecification","dayOfWeek":h.days,"opens":h.opens,"closes":h.closes}))
    };
    if(C.links.instagram) ld.sameAs=[C.links.instagram];
    if(rn>0 && rc>0) ld.aggregateRating={"@type":"AggregateRating","ratingValue":rn,"reviewCount":rc};
    const s=document.createElement('script'); s.type='application/ld+json'; s.textContent=JSON.stringify(ld); document.head.appendChild(s);
  }catch(e){}

  /* ---------- interactions ---------- */
  const reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  // unset links do nothing
  document.addEventListener('click',e=>{ const a=e.target.closest('a[data-unset]'); if(a) e.preventDefault(); });

  // mobile menu
  const mb=document.getElementById('menuBtn'), mn=document.getElementById('menu');
  const setMenu=o=>{ mn.classList.toggle('open',o); mb.setAttribute('aria-expanded',o); };
  mb.addEventListener('click',()=>setMenu(!mn.classList.contains('open')));
  mn.addEventListener('click',e=>{ if(e.target.closest('a')) setMenu(false); });
  document.addEventListener('keydown',e=>{ if(e.key==='Escape') setMenu(false); });

  // header shadow + progress bar
  const hd=document.getElementById('header'), pg=document.getElementById('progress');
  let tick=false;
  const onScroll=()=>{ tick=false;
    hd.classList.toggle('scrolled',window.scrollY>8);
    const h=document.documentElement.scrollHeight-window.innerHeight;
    pg.style.transform='scaleX('+(h>0?Math.min(1,window.scrollY/h):0)+')';
  };
  window.addEventListener('scroll',()=>{ if(!tick){ tick=true; requestAnimationFrame(onScroll);} },{passive:true});
  onScroll();

  // count-up numbers
  const countUp=el=>{
    const raw=el.dataset.count, m=raw.match(/^(\d+)(.*)$/);
    if(!m||reduce) return;
    const end=parseInt(m[1],10), suf=m[2], dur=1400, t0=performance.now();
    const step=t=>{ const p=Math.min(1,(t-t0)/dur), v=Math.round(end*(1-Math.pow(1-p,3)));
      el.textContent=v+suf; if(p<1) requestAnimationFrame(step); };
    el.textContent='0'+suf; requestAnimationFrame(step);
  };

  // scroll reveal
  const targets=document.querySelectorAll('.reveal');
  if('IntersectionObserver' in window && !reduce){
    const io=new IntersectionObserver(es=>{ es.forEach(en=>{
      if(!en.isIntersecting) return;
      en.target.classList.add('in');
      const dl=(parseInt(en.target.style.getPropertyValue('--i'),10)||0)*90+1100; setTimeout(()=>en.target.classList.add('done'),dl);
      const n=en.target.querySelector('[data-count]'); if(n) countUp(n);
      io.unobserve(en.target);
    }); },{threshold:.15,rootMargin:'0px 0px -6% 0px'});
    targets.forEach(t=>io.observe(t));
  } else { targets.forEach(t=>t.classList.add('in')); }

  // lightbox
  const lb=document.getElementById('lb'), lbImg=lb.querySelector('img');
  document.addEventListener('click',e=>{
    const t=e.target.closest('.tile.has-img');
    if(t){ lbImg.src=t.dataset.src; lbImg.alt=t.dataset.alt; lb.showModal(); return; }
    if(e.target===lb || e.target.closest('#lb button')) lb.close();
  });
})();
</script>
</body>
</html>
