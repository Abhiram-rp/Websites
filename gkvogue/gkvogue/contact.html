<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Contact — GK Vogue</title>
<meta name="description" content="Reach GK Vogue by WhatsApp, phone, email or visit our store.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<script src="js/config.js"></script>
</head>
<body>
<div id="site-header"></div>
<main>

<section class="pagehead"><div class="wrap"><div class="crumbs"><a href="index.html">Home</a> / Contact</div><h1>Reach out 👋</h1><p>Questions, sizes, bulk orders or just saying hi — we reply fast.</p></div></section>
<section class="wrap section"><div class="contact-grid">
  <form class="formcard" id="contact-form" novalidate>
    <h2>Send a message</h2>
    <label for="c-name">Your name</label><input id="c-name" name="name" required autocomplete="name">
    <label for="c-email">Email</label><input id="c-email" name="email" type="email" required autocomplete="email" placeholder="you@example.com">
    <label for="c-phone">Phone / WhatsApp (optional)</label><input id="c-phone" name="phone" type="tel" autocomplete="tel">
    <label for="c-topic">About</label><select id="c-topic" name="topic"><option>Product availability</option><option>Sizes &amp; fit</option><option>Bulk / group order</option><option>Feedback</option><option>Other</option></select>
    <label for="c-msg">Message</label><textarea id="c-msg" name="message" required></textarea>
    <button class="btn" type="submit">Send message →</button>
    <div class="ok" id="form-ok" role="status"></div>
  </form>
  <div style="display:grid;gap:22px">
    <div class="infocard"><h2 style="font-size:1.6rem">Find us</h2><dl>
      <dt>📍 Address</dt><dd data-fill="address"></dd><dt>🕙 Open</dt><dd data-fill="hours"></dd>
      <dt>📞 Phone</dt><dd><a data-fill="phone" href="#"></a></dd><dt>✉️ Email</dt><dd><a data-fill="email" href="#"></a></dd></dl>
      <p style="margin-top:18px"><a class="btn wa" data-fill="wa" target="_blank" rel="noopener" href="#">💬 Chat on WhatsApp</a></p></div>
    <div class="map" data-map></div>
  </div>
</div></section>

</main>
<div id="site-footer"></div>
<script src="js/data.js"></script>
<script src="js/app.js"></script>
</body>
</html>
